<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SBUYPRINT</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Thai',sans-serif;background:#f7f4ee;color:#171717}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.panel{background:#fff;border:1px solid #e5ded3;border-radius:16px;padding:20px;margin-bottom:18px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0 12px;font:inherit}button{padding:10px 15px;border:0;border-radius:9px;background:#171717;color:#fff;cursor:pointer;margin:4px}.light{background:#eee;color:#111}.danger{background:#b42318}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{border:1px solid #ddd;border-radius:12px;padding:12px}.thumb{width:100%;aspect-ratio:1;background:#eee;border-radius:9px;object-fit:cover}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="panel"><h1>เจ้าของร้าน</h1><p>เข้าสู่ระบบจัดการร้าน</p><input id="u" value="admin" placeholder="ชื่อผู้ใช้"><input id="pw" type="password" placeholder="รหัสผ่านเดิมที่ตั้งไว้แต่แรก"><button id="loginBtn" type="button">เข้าสู่ระบบ</button><div id="err"></div><p style="font-size:13px;color:#666">ค่าเริ่มต้นของระบบใหม่: admin / ChangeMe123!</p></div><div id="app" style="display:none"><div class="panel"><h1>จัดการร้านค้า</h1><button class="light" onclick="location.href='/shop'">ดูหน้าลูกค้า</button><button class="light" onclick="logout()">ออกจากระบบ</button></div><div class="panel"><h2>โลโก้และข้อมูลติดต่อ</h2><div class="row"><div><label><b>โลโก้ร้าน</b></label><input id="logo" type="file" accept="image/*"></div><div><label><b>QR Code ติดต่อร้าน</b></label><input id="qr" type="file" accept="image/*"></div></div><div class="row"><input id="shop" placeholder="ชื่อร้าน"><input id="tag" placeholder="ข้อความใต้ชื่อร้าน"></div><div class="row"><input id="phone" placeholder="เบอร์โทร"><input id="line" placeholder="LINE"></div><div class="row"><input id="facebook" placeholder="Facebook"><input id="email" placeholder="อีเมล"></div><input id="address" placeholder="ที่อยู่"><input id="foot" placeholder="ข้อความท้ายเว็บ"><button onclick="saveSettings()">บันทึกข้อมูลร้าน</button></div><div class="panel"><h2 id="formtitle">เพิ่มสินค้า</h2><input type="hidden" id="editId"><select id="cat"><option>หนังสือ</option><option>สติกเกอร์</option><option>งานกระดาษ</option><option>อคิลิค</option><option>เทคนิคพิเศษหลังพิมพ์</option><option>บริการเสริม</option><option>ตัวอย่างสินค้า</option></select><input id="name" placeholder="ชื่อสินค้า"><input id="price" placeholder="ราคา"><textarea id="desc" placeholder="รายละเอียด"></textarea><input id="img" type="file" accept="image/*"><button onclick="saveProduct()">บันทึกสินค้า</button><button class="light" onclick="clearForm()">ล้างฟอร์ม</button></div><div class="panel"><h2>สินค้า</h2><div id="list" class="grid"></div></div></div></div><script>const $=id=>document.getElementById(id);let data;async function me(){let r=await fetch('/api/me').then(x=>x.json());if(r.loggedIn)show()}async function login(){const btn=$('loginBtn');const err=$('err');err.textContent='';btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:$('u').value.trim(),password:$('pw').value})});let d={};try{d=await r.json()}catch(e){}if(!r.ok){err.textContent=d.error||'เข้าสู่ระบบไม่สำเร็จ';return}await show()}catch(e){err.textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณารีเฟรชหน้าแล้วลองใหม่';console.error(e)}finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}}async function show(){$('login').style.display='none';$('app').style.display='block';data=await fetch('/api/catalog').then(r=>r.json());let s=data.settings||{};$('shop').value=s.shop_name||'';$('tag').value=s.tagline||'';$('phone').value=s.phone||'';$('line').value=s.line||'';$('facebook').value=s.facebook||'';$('email').value=s.email||'';$('address').value=s.address||'';$('foot').value=s.footer||'';render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){$('list').innerHTML=(data.products||[]).map(p=>`<div class="item">${p.image?`<img class="thumb" src="${p.image}">`:'<div class="thumb"></div>'}<b>${esc(p.name)}</b><div>${esc(p.price)}</div><small>${esc(p.category)}</small><br><button onclick="edit(${p.id})">แก้ไข</button><button class="danger" onclick="del(${p.id})">ลบ</button></div>`).join('')||'<p>ยังไม่มีสินค้า</p>'}async function fileData(id){let f=$(id).files[0];if(!f)return undefined;return await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}async function saveSettings(){let logo=await fileData('logo'),qr=await fileData('qr'),b={shop_name:$('shop').value,tagline:$('tag').value,phone:$('phone').value,line:$('line').value,facebook:$('facebook').value,email:$('email').value,address:$('address').value,footer:$('foot').value};if(logo!==undefined)b.logo=logo;else b.logo=data.settings.logo||'';if(qr!==undefined)b.qr_code=qr;else b.qr_code=data.settings.qr_code||'';let r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return alert((await r.json()).error);data=await fetch('/api/catalog').then(r=>r.json());alert('บันทึกข้อมูลร้านแล้ว')}async function saveProduct(){let image=await fileData('img'),b={category:$('cat').value,name:$('name').value.trim(),price:$('price').value.trim(),description:$('desc').value};if(image!==undefined)b.image=image;else{let old=data.products.find(x=>x.id===Number($('editId').value));if(old)b.image=old.image||''}let id=$('editId').value,r=await fetch(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return alert((await r.json()).error);clearForm();data=await fetch('/api/catalog').then(r=>r.json());render();alert('บันทึกสินค้าแล้ว')}function edit(id){let p=data.products.find(x=>x.id===id);$('editId').value=p.id;$('cat').value=p.category;$('name').value=p.name;$('price').value=p.price;$('desc').value=p.description||'';$('formtitle').textContent='แก้ไขสินค้า'}function clearForm(){$('editId').value='';$('name').value='';$('price').value='';$('desc').value='';$('img').value='';$('cat').value='หนังสือ';$('formtitle').textContent='เพิ่มสินค้า'}async function del(id){if(!confirm('ลบสินค้านี้หรือไม่?'))return;await fetch('/api/products/'+id,{method:'DELETE'});data=await fetch('/api/catalog').then(r=>r.json());render()}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}$('loginBtn').addEventListener('click',login);$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});me();</script></body></html>
