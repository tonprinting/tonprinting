<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TON PRINTING</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,"Noto Sans Thai",sans-serif;margin:0;background:#faf8f4;color:#171717}
.wrap{max-width:1250px;margin:auto;padding:18px}
.head{padding:18px 12px 16px;background:#fff;border:1px solid #e5ded3;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.head-layout{display:grid;grid-template-columns:1fr 1.6fr 1fr;align-items:center;gap:24px;min-height:150px}
.brand-left{display:flex;align-items:center;justify-content:center;min-width:0}
.logo{max-height:125px;max-width:260px;width:auto;object-fit:contain}
.logo-fallback{font-size:28px;font-weight:900;letter-spacing:.5px;text-align:center}
.brand-center{text-align:center;min-width:0}
.brand-center h1{font-size:42px;margin:0 0 8px;font-weight:900;line-height:1.15}
.brand-center h1::after{content:"";display:block;width:130px;height:5px;border-radius:999px;background:linear-gradient(90deg,#00a8e8 25%,#ef2b8f 25% 50%,#ffd400 50% 75%,#171717 75%);margin:12px auto 10px}
.brand-center p{margin:0;color:#666;font-size:18px;line-height:1.5}
.contact-head{border-left:1px solid #ddd;padding-left:24px;display:flex;flex-direction:column;gap:10px;font-size:15px;min-width:0}
.contact-head .ci{display:flex;gap:9px;align-items:center;overflow:hidden}
.contact-head .label{font-weight:800;white-space:nowrap}
.contact-head .value{overflow-wrap:anywhere}
.category-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0 24px}
.category-card{display:flex;align-items:center;justify-content:center;min-height:105px;border-radius:18px;text-decoration:none;color:#171717;background:#fff;border:2px solid #e5ded3;box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:20px;font-weight:700;transition:.2s}
.category-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.cat-book{background:#fff8df}.cat-sticker{background:#e9f7ff}.cat-paper{background:#eff9ec}.cat-acrylic{background:#f5ecff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 24px}.tabs a{padding:9px 14px;background:#171717;color:#fff;border-radius:999px;text-decoration:none;font-size:14px}
.section{scroll-margin-top:15px;margin-top:28px}.section h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #e5ded3;border-radius:14px;padding:10px;min-width:0}
.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eee;cursor:zoom-in;display:block}
.card h3{font-size:17px;margin:10px 2px 5px}.card p{font-size:14px;color:#666;line-height:1.45}
.contact{margin-top:40px;background:#171717;color:#fff;border-radius:20px;padding:30px}.contact h2{font-size:32px;margin:0 0 22px}.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.contact-item{display:flex;align-items:flex-start;gap:12px;background:#fff;color:#171717;border-radius:14px;padding:18px 20px;min-height:76px;font-size:20px;font-weight:700;line-height:1.45}.contact-label{display:block;font-size:14px;color:#777;font-weight:600;margin-bottom:2px}.qr-box{margin-top:24px;background:#fff;color:#171717;border-radius:16px;padding:20px;text-align:center}.qr-box h3{margin:0 0 12px;font-size:22px}.qr-box img{width:220px;height:220px;object-fit:contain;border-radius:10px;border:1px solid #ddd;background:#fff}.footer-note{margin-top:18px;font-size:16px;color:#ddd}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:min(95vw,1200px);max-height:90vh;object-fit:contain;border-radius:12px;box-shadow:0 15px 50px rgba(0,0,0,.4)}.lightbox button{position:absolute;top:18px;right:22px;border:0;background:#fff;color:#111;width:44px;height:44px;border-radius:50%;font-size:28px;cursor:pointer}
@media(max-width:950px){.head-layout{grid-template-columns:1fr 1.4fr}.contact-head{grid-column:1/-1;border-left:0;border-top:1px solid #ddd;padding:14px 0 0;display:grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.category-menu{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.brand-center h1{font-size:32px}}
@media(max-width:600px){.wrap{padding:10px}.head-layout{grid-template-columns:1fr;gap:14px}.brand-left{order:1}.brand-center{order:2}.contact-head{order:3;grid-template-columns:1fr}.logo{max-height:100px;max-width:230px}.brand-center h1{font-size:28px}.brand-center p{font-size:15px}.category-card{min-height:90px;font-size:18px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.contact-grid{grid-template-columns:1fr}.contact h2{font-size:28px}.contact-item{font-size:18px}.qr-box img{width:190px;height:190px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head" id="head"></header>
<nav class="category-menu"><a class="category-card cat-book" href="#books">หนังสือ</a><a class="category-card cat-sticker" href="#stickers">สติกเกอร์</a><a class="category-card cat-paper" href="#paper">งานกระดาษ</a><a class="category-card cat-acrylic" href="#acrylic">อคิลิค</a></nav>
<nav class="tabs"><a href="#all">สินค้าทั้งหมด</a><a href="#special">เทคนิคพิเศษหลังพิมพ์</a><a href="#service">บริการเสริม</a><a href="#sample">ตัวอย่างสินค้า</a></nav>
<div id="products"></div>
<section class="contact" id="contact"></section>
</main>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)"><button aria-label="ปิด">×</button><img id="lightboxImg" alt="ตัวอย่างสินค้า"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(p){return `<article class="card">${p.image?`<img class="pic" src="${p.image}" alt="${esc(p.name)}" onclick="openLightbox(this.src)">`:'<div class="pic"></div>'}<h3>${esc(p.name)}</h3><div>${esc(p.price)}</div><p>${esc(p.description)}</p></article>`}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open')}
function closeLightbox(e){if(e.target.id==='lightbox'||e.target.tagName==='BUTTON')document.getElementById('lightbox').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open')});
async function load(){
 let d=await fetch('/api/catalog').then(r=>r.json()),s=d.settings||{};
 document.title=s.shop_name||'TON PRINTING';
 const shop=s.shop_name||'TON PRINTING', tag=s.tagline||'งานพิมพ์และงานสื่อสิ่งพิมพ์ครบวงจร';
 document.getElementById('head').innerHTML=`<div class="head-layout"><div class="brand-left">${s.logo?`<img class="logo" src="${s.logo}" alt="${esc(shop)}">`:`<div class="logo-fallback">TON PRINTING</div>`}</div><div class="brand-center"><h1>${esc(shop)}</h1><p>${esc(tag)}</p></div><div class="contact-head">${s.phone?`<div class="ci"><span class="label">โทร</span><span class="value">${esc(s.phone)}</span></div>`:''}${s.line?`<div class="ci"><span class="label">LINE</span><span class="value">${esc(s.line)}</span></div>`:''}${s.facebook?`<div class="ci"><span class="label">Facebook</span><span class="value">${esc(s.facebook)}</span></div>`:''}${s.email?`<div class="ci"><span class="label">อีเมล</span><span class="value">${esc(s.email)}</span></div>`:''}</div></div>`;
 let p=d.products||[];let cats=[['books','หนังสือ','หนังสือ'],['stickers','สติกเกอร์','สติกเกอร์'],['paper','งานกระดาษ','งานกระดาษ'],['acrylic','อคิลิค','อคิลิค'],['special','เทคนิคพิเศษหลังพิมพ์','เทคนิคพิเศษหลังพิมพ์'],['service','บริการเสริม','บริการเสริม'],['sample','ตัวอย่างสินค้า','ตัวอย่างสินค้า']];
 document.getElementById('products').innerHTML=`<section class="section" id="all"><h2>สินค้าทั้งหมด</h2><div class="grid">${p.map(card).join('')||'<p>ยังไม่มีสินค้า</p>'}</div></section>`+cats.map(([id,title,cat])=>`<section class="section" id="${id}"><h2>${title}</h2><div class="grid">${p.filter(x=>x.category===cat).map(card).join('')||'<p>ยังไม่มีรายการ</p>'}</div></section>`).join('');
 document.getElementById('contact').innerHTML=`<h2>ติดต่อ TON PRINTING</h2><div class="contact-grid">${s.phone?`<div class="contact-item"><div><span class="contact-label">โทรศัพท์</span>${esc(s.phone)}</div></div>`:''}${s.line?`<div class="contact-item"><div><span class="contact-label">LINE</span>${esc(s.line)}</div></div>`:''}${s.facebook?`<div class="contact-item"><div><span class="contact-label">Facebook</span>${esc(s.facebook)}</div></div>`:''}${s.email?`<div class="contact-item"><div><span class="contact-label">อีเมล</span>${esc(s.email)}</div></div>`:''}${s.address?`<div class="contact-item"><div><span class="contact-label">ที่อยู่ร้าน</span>${esc(s.address)}</div></div>`:''}</div>${s.qr_code?`<div class="qr-box"><h3>สแกน QR Code เพื่อติดต่อร้าน</h3><img src="${s.qr_code}" alt="QR Code ติดต่อร้าน"></div>`:''}<div class="footer-note">${esc(s.footer||'')}</div>`;
}
load();
</script>
</body></html>
