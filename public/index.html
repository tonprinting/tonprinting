<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBUYPRINT</title><style>
*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Thai",sans-serif;margin:0;background:#faf8f4;color:#171717}.wrap{max-width:1150px;margin:auto;padding:22px 18px}.head{text-align:center;padding:20px 10px 12px}.logo{max-height:90px;max-width:180px;object-fit:contain}.head h1{margin:10px 0 4px}.head p{margin:0;color:#666}.category-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0 30px}.category-card{display:flex;align-items:center;justify-content:center;min-height:125px;border-radius:18px;text-decoration:none;color:#171717;background:#fff;border:2px solid #e5ded3;box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:22px;font-weight:700;transition:.2s}.category-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}.cat-book{background:#fff8df}.cat-sticker{background:#e9f7ff}.cat-paper{background:#eff9ec}.cat-acrylic{background:#f5ecff}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 24px}.tabs a{padding:9px 14px;background:#171717;color:#fff;border-radius:999px;text-decoration:none;font-size:14px}.section{scroll-margin-top:15px;margin-top:28px}.section h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e5ded3;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee;display:block;cursor:zoom-in;transition:transform .15s ease}.pic:hover{transform:scale(1.015)}.sample-section .card{padding:7px}.sample-section .pic{aspect-ratio:4/3;object-fit:contain;background:#f3f3f3}.contact{margin-top:40px;background:#171717;color:#fff;border-radius:20px;padding:30px}.contact h2{font-size:32px;margin:0 0 22px}.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.contact-item{display:flex;align-items:flex-start;gap:12px;background:#fff;color:#171717;border-radius:14px;padding:18px 20px;min-height:76px;font-size:20px;font-weight:700;line-height:1.45}.contact-label{display:block;font-size:14px;color:#777;font-weight:600;margin-bottom:2px}.qr-box{margin-top:24px;background:#fff;color:#171717;border-radius:16px;padding:20px;text-align:center}.qr-box h3{margin:0 0 12px;font-size:22px}.qr-box img{width:220px;height:220px;object-fit:contain;border-radius:10px;border:1px solid #ddd;background:#fff}.qr-empty{font-size:17px;color:#666;padding:28px}.footer-note{margin-top:18px;font-size:16px;color:#ddd}@media(max-width:700px){.contact-grid{grid-template-columns:1fr}.contact h2{font-size:28px}.contact-item{font-size:18px}.qr-box img{width:190px;height:190px}}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.category-menu{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.category-card{min-height:100px;font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:6px}.sample-section .pic{aspect-ratio:1}}
.image-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:24px}.image-modal.open{display:flex}.image-modal img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff}.image-modal .close{position:absolute;top:14px;right:20px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:30px;line-height:1;cursor:pointer}.image-modal .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:14px}</style></head><body><main class="wrap"><header class="head" id="head"></header>
<nav class="category-menu"><a class="category-card cat-book" href="#books">หนังสือ</a><a class="category-card cat-sticker" href="#stickers">สติกเกอร์</a><a class="category-card cat-paper" href="#paper">งานกระดาษ</a><a class="category-card cat-acrylic" href="#acrylic">อคิลิค</a></nav>
<nav class="tabs"><a href="#all">สินค้าทั้งหมด</a><a href="#special">เทคนิคพิเศษหลังพิมพ์</a><a href="#service">บริการเสริม</a><a href="#sample">ตัวอย่างสินค้า</a></nav><div id="products"></div><section class="contact" id="contact"></section></main><div class="image-modal" id="imageModal" onclick="closeImage(event)"><button class="close" type="button" aria-label="ปิด" onclick="closeImage()">×</button><img id="modalImage" src="" alt=""><div class="hint">คลิกนอกภาพเพื่อปิด</div></div>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function card(p,isSample=false){return `<article class="card${isSample?' sample-card':''}">${p.image?`<img class="pic" src="${p.image}" alt="${esc(p.name)}" onclick="openImage(this.src,this.alt)">`:'<div class="pic"></div>'}<h3>${esc(p.name)}</h3><div>${esc(p.price)}</div><p>${esc(p.description)}</p></article>`}async function load(){let d=await fetch('/api/catalog').then(r=>r.json()),s=d.settings||{};document.title=s.shop_name||'SBUYPRINT';document.getElementById('head').innerHTML=(s.logo?`<img class="logo" src="${s.logo}">`:'')+`<h1>${esc(s.shop_name||'SBUYPRINT')}</h1><p>${esc(s.tagline||'')}</p>`;let p=d.products||[];let cats=[['books','หนังสือ','หนังสือ'],['stickers','สติกเกอร์','สติกเกอร์'],['paper','งานกระดาษ','งานกระดาษ'],['acrylic','อคิลิค','อคิลิค'],['special','เทคนิคพิเศษหลังพิมพ์','เทคนิคพิเศษหลังพิมพ์'],['service','บริการเสริม','บริการเสริม'],['sample','ตัวอย่างสินค้า','ตัวอย่างสินค้า']];document.getElementById('products').innerHTML=`<section class="section" id="all"><h2>สินค้าทั้งหมด</h2><div class="grid">${p.map(x=>card(x)).join('')||'<p>ยังไม่มีสินค้า</p>'}</div></section>`+cats.map(([id,title,cat])=>`<section class="section ${id==='sample'?'sample-section':''}" id="${id}"><h2>${title}</h2><div class="grid">${p.filter(x=>x.category===cat).map(x=>card(x,id==='sample')).join('')||'<p>ยังไม่มีรายการ</p>'}</div></section>`).join('');document.getElementById('contact').innerHTML=`<h2>ติดต่อเรา</h2><div class="contact-grid">${s.phone?`<div class="contact-item"><div><span class="contact-label">โทรศัพท์</span>${esc(s.phone)}</div></div>`:''}${s.line?`<div class="contact-item"><div><span class="contact-label">LINE</span>${esc(s.line)}</div></div>`:''}${s.facebook?`<div class="contact-item"><div><span class="contact-label">Facebook</span>${esc(s.facebook)}</div></div>`:''}${s.email?`<div class="contact-item"><div><span class="contact-label">อีเมล</span>${esc(s.email)}</div></div>`:''}${s.address?`<div class="contact-item"><div><span class="contact-label">ที่อยู่ร้าน</span>${esc(s.address)}</div></div>`:''}</div>${s.qr_code?`<div class="qr-box"><h3>สแกน QR Code เพื่อติดต่อร้าน</h3><img src="${s.qr_code}" alt="QR Code ติดต่อร้าน"></div>`:''}<div class="footer-note">${esc(s.footer||'')}</div>`}function openImage(src,alt){const m=document.getElementById('imageModal');const i=document.getElementById('modalImage');i.src=src;i.alt=alt||'';m.classList.add('open');document.body.style.overflow='hidden'}function closeImage(e){if(e&&e.target&&e.target.id==='modalImage')return;document.getElementById('imageModal').classList.remove('open');document.getElementById('modalImage').src='';document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImage()});load();</script></body></html>
